<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rohit Sen - Portfolio</title>
    <script type="text/javascript">
      // For GitHub Pages project sites, redirect any unknown path back to the
      // app root so HashRouter can take over. Auto-detects repo segment.
      (function () {
        var l = window.location;
        var segments = l.pathname.split('/').filter(Boolean);
        // Assume first segment is the repo name on project pages
        var base = segments.length > 0 ? '/' + segments[0] + '/' : '/';
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base);
      })();
    </script>
  </head>
  <body></body>
</html>
